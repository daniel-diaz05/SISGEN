<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de usuario</title>
    <link rel="stylesheet" href="../../public/css/styles.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">

  <div class="container mt-5">
    <!--volver-->
    <a href="index.html" class="text-dark mb-3 d-block" style="font-size: 24px;">←</a>

    <!--Titulo-->
    <h2 class="text-center mb-4">Regístrate</h2>

    <!--Formulario-->
    <form class="mx-auto" style="max-width: 500px;">
      <div class="mb-3">
        <label for="nombres" class="form-label">Nombres</label>
        <input type="text" class="form-control" id="nombres" placeholder="Tus nombres">
      </div>
      <div class="mb-3">
        <label for="apellidos" class="form-label">Apellidos</label>
        <input type="text" class="form-control" id="apellidos" placeholder="Tus apellidos">
      </div>
      <div class="mb-3">
        <label for="cedula" class="form-label">Número de cédula</label>
        <input type="text" class="form-control" id="cedula" placeholder="Tu cédula">
      </div>
      <div class="mb-3">
        <label for="fecha" class="form-label">Fecha de nacimiento</label>
        <input type="date" class="form-control" id="fecha">
      </div>

      <button type="submit" class="btn custom-btn d-block mx-auto mt-4">Crear cuenta</button>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>

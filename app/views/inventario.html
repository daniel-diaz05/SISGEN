<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Inventario</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="../../public/css/styles.css">
  <!--Libreria DataTables-->
  <link rel="stylesheet" href="https://cdn.datatables.net/1.13.4/css/jquery.dataTables.min.css">
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdn.datatables.net/1.13.4/js/jquery.dataTables.min.js"></script>
</head>
<body class="bg-light p-4">

<!-- Sidebar -->

<div class="d-flex">
  <nav id="sidebarMenu" class="sidebar">
    <div class="position-sticky">
      <div class="list-group list-group-flush mx-3 mt-4">
        
        <a href="dashboard.html" class="list-group-item list-group-item-action py-2 ripple">
          <i class="bi bi-speedometer2 me-2"></i><span>Dashboard</span>
        </a>
        
        <a href="inventario.html" class="list-group-item list-group-item-action py-2 ripple">
          <i class="bi bi-box-seam me-2"></i><span>Inventario</span>
        </a>
        
        <a href="compras.html" class="list-group-item list-group-item-action py-2 ripple">
          <i class="bi bi-cart-plus me-2"></i><span>Compras</span>
        </a>

        <a href="usuarios.html" class="list-group-item list-group-item-action py-2 ripple">
          <i class="bi bi-people me-2"></i><span>Usuarios</span>
        </a>
        
        <a href="index.html" class="list-group-item list-group-item-action py-2 ripple">
          <i class="bi bi-box-arrow-right me-2"></i><span>Salir</span>
        </a>
      </div>
    </div>
  </nav>

  <!-- Contenido principal -->
  <div class="container-fluid" style="margin-left: 220px;">
    <!-- contenido pag

  <!-- Flecha para volver -->
  <a href="dashboard.html" class="text-decoration-none text-dark mb-3 d-inline-block">
    ← Volver
  </a>

  <!-- Título centrado -->
  <h2 class="text-center mb-4">Inventario</h2>
<p class="text-center">
  <strong>Última actualización:</strong> <span id="ultima-actualizacion">-</span>
</p>
  <!-- Formulario para agregar o editar productos-->
<div class="mb-4">
  <h5>Agregar o Editar Producto</h5>
<form id="form-producto" class="row g-2">
  <input type="hidden" id="id" name="id"> <!-- vacío = crear; con valor = editar -->
  <div class="col-md-4">
    <input type="text" class="form-control" id="producto" name="producto" placeholder="Producto" required>
  </div>
  <div class="col-md-4">
    <input type="text" class="form-control" id="descripcion" name="descripcion" placeholder="Descripción" required>
  </div>
  <div class="col-md-4">
    <input type="text" class="form-control" id="categoria" name="categoria" placeholder="Categoría" required>
  </div>
  <div class="col-md-4">
    <input type="number" class="form-control" id="stock" name="stock" placeholder="Stock" required>
  </div>
  <div class="col-md-4">
    <input type="text" class="form-control" id="codigo" name="codigo" placeholder="Código" required>
  </div>

  <div class="mb-3">
    <label for="precio_compra" class="form-label">Precio de Compra</label>
    <input type="number" class="form-control" id="precio_compra" name="precio_compra" required>
  </div>
  <div class="mb-3">
    <label for="precio_venta" class="form-label">Precio de Venta</label>
    <input type="number" class="form-control" id="precio_venta" name="precio_venta" required>
  </div>

<script>
  const rol = localStorage.getItem("rol");

  if (rol !== "admin") {
    document.getElementById("form-producto").style.display = "none";
  }
</script>

  <!-- Imagen -->
  <div class="mb-3">
    <label for="imagen" class="form-label">Nombre de imagen (opcional)</label>
    <input type="text" class="form-control" id="imagen" name="imagen" placeholder="ej: martillo.jpg">
  </div>

  <div class="col-md-4">
    <button type="submit" class="btn btn-dark w-100">Guardar Producto</button>
  </div>
</form>

</div>

<!-- Filtro de búsqueda -->
<div class="mb-3">
  <input type="text" id="buscador" class="form-control" placeholder="Buscar producto, código, descripción...">
</div>

<!-- Vista por categorías-->

<div class="mb-4">
  <label for="categoriaFiltro" class="form-label fw-bold">Filtrar por categoría:</label>
  <select id="categoriaFiltro" class="form-select">
    <option value="todos">Todas las categorías</option>
    <option value="Tornillería">Tornillería</option>
    <option value="Herramientas manuales">Herramientas manuales</option>
    <option value="Herramientas eléctricas">Herramientas eléctricas</option>
    <option value="Accesorios para Herramientas">Accesorios para Herramientas</option>
    <option value="Medición y Nivelación">Medición y Nivelación</option>
  </select>
</div>

  <!-- Tabla de inventario -->
  <div class="table-responsive">
    <table id="tabla-inventario" class="table table-bordered text-center align-middle">
      <thead class="table-dark">
        <tr>
          <th>Producto</th>
          <th>Descripción</th>
          <th>Categoría</th>
          <th>Stock</th>
          <th>Código</th>
          <th>Precio Compra</th>
          <th>Precio Venta</th>
          <th>Imagen</th>
          <th>Acciones</th>
          <th>Carrito</th>
        </tr>
      </thead>
      <tbody id="tablaInventario"></tbody>
    </table>
  </div>

<!-- Carrito de compras -->
<h3 class="mt-4">Carrito de compras</h3>
<div class="table-responsive">
  <table class="table table-bordered text-center align-middle">
    <thead class="table-secondary">
      <tr>
        <th>Producto</th>
        <th>Cantidad</th>
        <th>Acciones</th>
      </tr>
    </thead>
    <tbody id="carrito-body">
    </tbody>
  </table>
</div>

<button class="btn btn-primary" id="btn-confirmar-compra">Confirmar compra</button>

<script src="../../public/js/main.js"></script>
</body>
</html>

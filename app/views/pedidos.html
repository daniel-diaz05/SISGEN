<h3 class="text-center mt-4">Gestión de Pedidos</h3>

<!--Nueva solicitud form-->
<h5 class="mt-4">Nueva solicitud (varios productos)</h5>
<form id="formSolicitud" class="row g-2">
  <div class="col-md-4">
    <label class="form-label">Producto</label>
    <select id="solProducto" class="form-select"></select>
  </div>
  <div class="col-md-2">
    <label class="form-label">Cantidad</label>
    <input id="solCantidad" type="number" min="1" class="form-control" value="1">
  </div>
  <div class="col-md-2 d-flex align-items-end">
    <button id="btnAgregarItem" type="button" class="btn btn-dark">Añadir a la solicitud</button>
  </div>
  <div class="col-md-4">
    <label class="form-label">Solicitante</label>
    <input id="solSolicitante" type="text" class="form-control" placeholder="Tu nombre">
  </div>
  <div class="col-md-8">
    <label class="form-label">Motivo (opcional)</label>
    <input id="solMotivo" type="text" class="form-control">
  </div>
  <div class="col-12">
    <div class="table-responsive">
      <table class="table table-sm table-bordered text-center align-middle">
        <thead class="table-secondary">
          <tr><th>Producto</th><th>Cantidad</th><th>Quitar</th></tr>
        </thead>
        <tbody id="tbodyItemsSolicitud"></tbody>
      </table>
    </div>
  </div>
  <div class="col-12">
    <button id="btnEnviarSolicitud" type="button" class="btn btn-dark">Enviar solicitud</button>
  </div>
</form>
<hr>

<h5>Solicitudes registradas</h5>
<div class="table-responsive">
  <table class="table table-bordered text-center align-middle">
    <thead class="table-dark">
      <tr>
        <th>ID</th><th>Solicitante</th><th>Motivo</th>
        <th>Items</th><th>Unidades</th><th>Estado</th><th>Fecha</th><th>Acciones</th>
      </tr>
    </thead>
    <tbody id="tbodySolicitudes"></tbody>
  </table>
</div>

<!-- Modal: Detalle de Solicitud -->
<div class="modal fade" id="modalSolDetalle" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Detalle de la solicitud</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
      </div>
      <div class="modal-body">
        <div class="table-responsive">
          <table class="table table-sm table-bordered text-center align-middle">
            <thead class="table-secondary">
              <tr><th>Producto</th><th>Cantidad</th></tr>
            </thead>
            <tbody id="tbodySolDetalle"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

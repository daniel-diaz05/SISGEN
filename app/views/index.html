<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión - SISGEN</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../../public/css/styles.css">
</head>
<body class="bg-light d-flex align-items-center justify-content-center vh-100">

  <div class="card shadow-lg border-0 rounded-4 overflow-hidden" style="max-width: 900px; width: 100%;">
    <div class="row g-0">
      <!-- Imagen -->
      <div class="col-md-6 d-none d-md-flex align-items-center justify-content-center bg-white">
        <img src="../../public/Recursos/LogoGlobesoft.png" alt="Logo Globesoft" style="max-width: 70%;">
      </div>

      <!-- Formulario -->
      <div class="col-md-6 p-4">
        <h2 class="mb-4 text-center fw-bold" style="color: #181141;">¡Bienvenido de nuevo!</h2>
        <form id="formLogin">
          <div class="mb-3">
            <label class="form-label">Usuario</label>
            <input
              type="email"
              class="form-control"
              id="email"
              placeholder="Ingresa tu correo"
              required
            />
          </div>
          <div class="mb-3">
            <label class="form-label">Contraseña</label>
            <input
              type="password"
              class="form-control"
              id="password"
              placeholder="Ingresa tu contraseña"
              required
            />
          </div>
          <button type="submit" class="btn btn-primary w-100 mb-3">Iniciar sesión</button>
        </form>
      </div>
    </div>
  </div>

  <script src="../../public/js/main.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0", maximum-scale=1.0 > 
  <title>Inicio de Sesión</title>
  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
  <link href="styles.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center vh-100">

  <div class="container">
    <div class="row justify-content-center">
      <div class="col-lg-8 col-md-10">
        <div class="card shadow-lg border-0 rounded-4 overflow-hidden">
          <div class="row g-0">
            
            <!-- Imagen -->
            <div class="col-md-6 d-none d-md-flex align-items-center justify-content-center bg-light">
              <img src="../Recursos/LogoGlobesoft.png" alt="Logo Globesoft" class="img-fluid p-4">
            </div>

            <!-- Formulario -->
            <div class="col-md-6 p-4">
              <h2 class="mb-4 text-center fw-bold" style="color:#181141;">¡Bienvenido de nuevo!</h2>
              <form>
                <div class="mb-3">
                  <label for="email" class="form-label">Usuario</label>
                  <input type="email" class="form-control input-morado" id="email" placeholder="Ingresa tu correo">
                </div>
                <div class="mb-3">
                  <label for="password" class="form-label">Contraseña</label>
                  <input type="password" class="form-control input-morado" id="password" placeholder="Ingresa tu contraseña">
                </div>
                <a href="dashboard.html" class="btn custom-btn w-100 mb-3">Iniciar sesión</a>
<!--                <button id="loginBtn" class="btn custom-btn w-100 mb-3">Iniciar sesión</button> botón xxxxxx -->
                <div class="text-center">
                  <a href="registro.html" style="color:#181141;">Crear cuenta</a>
                </div>
              </form>
            </div>

          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js" integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO" crossorigin="anonymous"></script>
  <script src="main.js"></script>
</body>
</html>
